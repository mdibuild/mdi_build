name: mdi_build
description: Advanced construction management starter
publish_to: "none"
version: 1.9.0+10

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  audioplayers: ^6.8.0
  record: ^7.1.1
  http: ^1.2.2
  url_launcher: ^6.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  supabase_flutter: ^2.5.6
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  equatable: ^2.0.5
  uuid: ^4.5.1
  pdf: ^3.13.0
  printing: ^5.15.0
  excel: ^4.0.6
  file_picker: ^11.0.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.3.0

dependency_overrides:
  xml: ^7.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Icône de l'application : logo MDI Build dans un cadre doré.
# Régénérer : dart run tool/make_app_icon.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  # Android 8+ : fond doré + logo au centre (le cadre doré reste visible
  # quelle que soit la forme d'icône du téléphone).
  adaptive_icon_background: "#D4A72C"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#D4A72C"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0B2436"
    theme_color: "#0B2436"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
